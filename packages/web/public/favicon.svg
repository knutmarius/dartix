<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DartiX">
  <!--
    A bullseye, not a dartboard.

    Twenty wedges and four rings are what the app draws in the game, and all of
    it turns to mush at the 16 and 32 pixels a tab actually uses. Two
    concentric shapes survive that, so the mark is the double ring and the bull
    in the interface accent, on the app's own ground so it holds its own
    against a light or a dark tab bar.

    Geometry is deliberately integer on the 32-unit grid — the ring spans radius
    8 to 12, the bull 0 to 4 — so a 32px raster lands on whole pixels instead of
    smearing across them. The faint middle ring is for the larger renders; below
    32px it falls under a pixel and disappears, which is the intent.
  -->
  <rect width="32" height="32" rx="7" fill="#101114"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#4dabf7" stroke-width="4"/>
  <circle cx="16" cy="16" r="6.5" fill="none" stroke="#3a414c" stroke-width="1"/>
  <circle cx="16" cy="16" r="4" fill="#4dabf7"/>
</svg>
