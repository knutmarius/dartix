<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Square and full-bleed: iOS and Android mask the corners themselves, so
       baking a radius in leaves a dark halo outside the mask. Artwork sits
       inside the 80% safe circle a maskable icon has to survive. -->
  <rect width="32" height="32" fill="#101114"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#4dabf7" stroke-width="3.8"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#3a414c" stroke-width="1.1"/>
  <circle cx="16" cy="16" r="4" fill="#4dabf7"/>
</svg>
